name: Build Portable REA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-portable-rea.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout REA fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install source dependencies
        run: npm ci

      - name: Build REA
        run: npm run build:cached

      - name: Pack self-contained REA runtime
        shell: bash
        run: |
          set -euo pipefail

          PACK_DIR="$RUNNER_TEMP/rea-pack"
          PORTABLE="$RUNNER_TEMP/rea-portable"

          mkdir -p "$PACK_DIR"
          mkdir -p "$PORTABLE/bin"

          npm pack --pack-destination "$PACK_DIR"

          PKG="$(find "$PACK_DIR" -maxdepth 1 -name 'rea-agents-*.tgz' -print -quit)"
          test -n "$PKG"

          npm install \
            --prefix "$PORTABLE" \
            --omit=dev \
            --no-audit \
            --no-fund \
            "$PKG"

          cp "$(command -v node)" "$PORTABLE/bin/node"
          chmod +x "$PORTABLE/bin/node"

          cat > "$PORTABLE/bin/rea" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          exec "$ROOT/bin/node" \
            "$ROOT/node_modules/rea-agents/scripts/rea.mjs" \
            "$@"
          EOF

          chmod +x "$PORTABLE/bin/rea"

          "$PORTABLE/bin/node" --version
          "$PORTABLE/bin/rea" --help >/dev/null

          tar -czf "$RUNNER_TEMP/rea-portable-linux-x64.tgz" \
            -C "$PORTABLE" .

      - name: Upload portable REA runtime
        uses: actions/upload-artifact@v4
        with:
          name: rea-portable-linux-x64
          path: ${{ runner.temp }}/rea-portable-linux-x64.tgz
          if-no-files-found: error
          retention-days: 7
