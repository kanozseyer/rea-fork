name: Build Portable REA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-portable-rea.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout REA fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install source dependencies
        run: npm ci

      - name: Build REA
        run: npm run build:cached

      - name: Pack verified local REA build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-pack"
          npm pack --pack-destination "$RUNNER_TEMP/rea-pack"
          PKG="$(find "$RUNNER_TEMP/rea-pack" -maxdepth 1 -name 'rea-agents-*.tgz' -print -quit)"
          test -n "$PKG"
          mkdir -p "$RUNNER_TEMP/rea-portable"
          npm install \
            --prefix "$RUNNER_TEMP/rea-portable" \
            --omit=dev \
            --no-audit \
            --no-fund \
            "$PKG"
          "$RUNNER_TEMP/rea-portable/node_modules/.bin/rea" --help >/dev/null
          tar -czf "$RUNNER_TEMP/rea-portable-linux-x64.tgz" \
            -C "$RUNNER_TEMP/rea-portable" .

      - name: Upload portable REA runtime
        uses: actions/upload-artifact@v4
        with:
          name: rea-portable-linux-x64
          path: ${{ runner.temp }}/rea-portable-linux-x64.tgz
          if-no-files-found: error
          retention-days: 1
