name: Temporary REA Bundle

on:
  push:
    paths:
      - '.github/workflows/temp-prepare-rea-bundle.yml'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Prepare REA and JADX bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/rea-prefix bundle/android
          npm install --prefix bundle/rea-prefix rea-agents@6.7.0
          curl -fL -o bundle/android/jadx-headless-mcp-0.7.1-all.jar https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  bundle/android/jadx-headless-mcp-0.7.1-all.jar' | sha256sum -c -
          node bundle/rea-prefix/node_modules/rea-agents/scripts/rea.mjs --version
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: rea-linux-bundle
          path: bundle
          if-no-files-found: error
          retention-days: 1
